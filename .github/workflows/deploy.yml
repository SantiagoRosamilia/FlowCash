# .github/workflows/deploy.yml
#
# Este archivo le dice a GitHub qué hacer cada vez que subís código.
# Flujo:
#   1. Detecta que hiciste "git push" a la rama main
#   2. Instala Node.js y las dependencias del proyecto
#   3. Construye la app con Vite (genera HTML/JS/CSS optimizados)
#   4. Publica el resultado en GitHub Pages
#   5. En ~2 minutos tu URL está actualizada

name: Deploy FlowCash a GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Construir FlowCash
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4